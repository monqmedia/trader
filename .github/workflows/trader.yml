name: inversor

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      solo_comprobar:
        description: "Solo comprobar la cuenta real (no opera)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: inversor
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Repositorio público = minutos gratis ilimitados -> vigilancia continua minuto a minuto.
      # Privado = una ronda cada 30 min (para no pasar de los 2.000 minutos gratis).
      - name: Visibilidad del repositorio
        id: vis
        run: echo "private=$(gh api repos/${{ github.repository }} --jq .private)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ronda del inversor
        run: python -m bot
        env:
          MODE: ${{ vars.MODE }}
          CHECK_ONLY: ${{ inputs.solo_comprobar && '1' || '' }}
          GUARD_MINUTES: ${{ vars.GUARD_MINUTES || (steps.vis.outputs.private == 'false' && '50' || '0') }}
          GIT_PERSIST: "1"
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_ACCOUNT_INDEX: ${{ vars.SOLANA_ACCOUNT_INDEX }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}

      - name: Guardar memoria
        if: always() && !inputs.solo_comprobar
        run: |
          git config user.name "inversor-bot"
          git config user.email "inversor-bot@users.noreply.github.com"
          git add state/ || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "ronda $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
