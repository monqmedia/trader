name: inversor

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch: {}       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: inversor
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ronda del inversor
        run: python -m bot
        env:
          MODE: ${{ vars.MODE }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}

      - name: Guardar memoria
        if: always()
        run: |
          git config user.name "inversor-bot"
          git config user.email "inversor-bot@users.noreply.github.com"
          git add state/ || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "ronda $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
